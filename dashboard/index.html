<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="経営ダッシュボード">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a365d">
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a365d; overscroll-behavior:none; }
  #wrap { position:fixed; inset:0;
           padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  iframe { display:block; width:100%; height:100%; border:0; background:#f0f2f7; }
  /* iframeが開けなかったときだけ出す逃げ道 */
  #fallback { display:none; position:fixed; left:0; right:0; bottom:0;
               padding:14px calc(14px + env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom));
               background:#1a365d; color:#f7f3e8; font:15px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;
               text-align:center; }
  #fallback a { color:#e0a83c; font-weight:600; }
</style>
</head>
<body>
<div id="wrap"><iframe id="app" src="https://script.google.com/macros/s/AKfycby8djq51pJMmeZVE8A175nMWKsE3azxFv8mzz6CeDEocI3i0kMTLyrLql3fcQWZSQajMg/exec?app=dashboard" allow="camera; clipboard-write"
     referrerpolicy="no-referrer-when-downgrade"></iframe></div>
<div id="fallback">うまく開けないときは <a href="https://script.google.com/macros/s/AKfycby8djq51pJMmeZVE8A175nMWKsE3azxFv8mzz6CeDEocI3i0kMTLyrLql3fcQWZSQajMg/exec?app=dashboard">Safariで直接開く</a></div>
<script>
  var loaded = false;
  document.getElementById('app').addEventListener('load', function () { loaded = true; });
  setTimeout(function () {
    if (!loaded) document.getElementById('fallback').style.display = 'block';
  }, 8000);
</script>
</body>
</html>
